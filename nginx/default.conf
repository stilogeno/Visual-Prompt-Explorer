# Main Nginx configuration for Krea 2 Turbo Style Explorer
# Serves static files and proxies API calls to local Supabase (npx supabase start)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Disable caching for development, enable for production
    # add_header Cache-Control "no-cache, no-store, must-revalidate";
    # add_header Pragma "no-cache";
    # add_header Expires "0";

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    # Serve static files
    location / {
        try_files $uri $uri/ $uri.html $uri/ =404;

        # WebP files - serve without extension rewriting
        location ~* \.webp$ {
            add_header Content-Type image/webp;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }

        # JavaScript files
        location ~* \.js$ {
            add_header Content-Type application/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }

        # CSS files
        location ~* \.css$ {
            add_header Content-Type text/css;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }

        # Images
        location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }
    }

    # Supabase REST API proxy (local: npx supabase start)
    # Use Docker gateway IP (172.17.0.1) instead of host.docker.internal for NAS compatibility
    location /etc/ {
        proxy_pass http://172.17.0.1:54321/etc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # JSON content type
        proxy_set_header Accept "application/json";

        # Increase timeout for slow queries
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Supabase Auth proxy (local: npx supabase start)
    # Use Docker gateway IP (172.17.0.1) instead of host.docker.internal for NAS compatibility
    location /auth/v1/ {
        proxy_pass http://172.17.0.1:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for real-time
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}